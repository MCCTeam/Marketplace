schema-version = 2
kind = "compiled"
target = "any"
framework = "net10.0"
dmcbk = ">=0.1.0-preview.6 <0.2.0"
umpk = ">=0.9.0-beta.6 <0.10.0"
needs = ["commands"]
# TelegramBridge - relays game chat to a Telegram chat and back.
# Needs a bot token from @BotFather in settings.toml. With no token set the plugin self-disables and logs why.
# See /man writing-plugins for what each manifest field means.
id = "telegram-bridge"
version = "2.0.1"
entry = "DMCBK.OfficialPlugins.TelegramBridge.dll"
api-version = "1.0"

man = ["telegram-bridge"]

[meta]
description = "Relays game chat to a Telegram chat and messages back into the game."
tags = ["chat", "telegram", "bridge"]
uses = ["chat", "network", "commands"]

[services]
offline = true
