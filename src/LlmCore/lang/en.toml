[settings]
enabled = "Set to false to keep the plugin loaded but idle."
default_model = "Default model as provider/model-id. Empty means callers must name one."
default_max_tokens = "Cap per answer. Zero means the provider default."
default_max_context = "Context token cap for auto compaction. Zero means 32000."
daily_token_budget = "Global daily token budget. Zero means unlimited."
plugin_budgets = "Per-plugin daily token budgets."
providers = "Shared providers. Keys come from the named environment variables."
provider_name = "Local name used as provider/model-id."
provider_endpoint = "Base URL, for example https://api.openai.com/v1."
provider_api = "responses or chat. Chat is the legacy path."
provider_enabled = "Disabled providers are skipped, never probed."
provider_key_env = "Environment variable holding the key. Empty allows keyless local servers."
mcp_servers = "Shared MCP servers, connected lazily."
mcp_name = "Local name. Remote tools surface as name_tool."
mcp_transport = "http or sse."
mcp_url = "Server URL."
mcp_tools = "Remote tool names to expose. Empty on add means all advertised."
budget_plugin = "Plugin id the budget applies to."
budget_tokens = "Tokens per day for that plugin."
allow_local_endpoints = "Allow http localhost endpoints. Needed for local test stubs."
