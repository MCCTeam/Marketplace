schema-version = 2
kind = "compiled"
target = "any"
framework = "net10.0"
dmcbk = ">=0.1.0-preview.8 <0.2.0"
umpk = ">=0.9.0-beta.7 <0.10.0"
needs = ["commands"]
# DiscordBridge - relays game chat to a Discord channel and back.
# Needs a Discord bot token, a guild id and a channel id in settings.toml. With no token set the plugin
# self-disables and logs why.
# See /man writing-plugins for what each manifest field means.
id = "discord-bridge"
version = "2.0.3"
entry = "DMCBK.OfficialPlugins.DiscordBridge.dll"
api-version = "1.0"

man = ["discord-bridge"]

[meta]
description = "Relays game chat to a Discord channel and Discord messages back into the game."
tags = ["chat", "discord", "bridge"]
uses = ["chat", "network", "commands"]

[services]
offline = true
