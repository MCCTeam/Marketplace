schema-version = 2
kind = "compiled"
target = "any"
framework = "net10.0"
dmcbk = ">=0.1.0-preview.8 <0.2.0"
umpk = ">=0.9.0-beta.7 <0.10.0"
needs = ["commands"]
# ReplayCapture - records the session as a ReplayMod .mcpr file.
# NOTE: the raw packet feed is taken at PluginContext.SessionCreated, before the session dials, so
# recording starts at the handshake and login frames rather than at the first play packet.
# See /man writing-plugins for what each manifest field means.
id = "replay-capture"
version = "2.0.3"
entry = "DMCBK.OfficialPlugins.ReplayCapture.dll"
api-version = "1.0"

man = ["replay-capture"]

[meta]
description = "Records the session as a ReplayMod .mcpr file."
tags = ["recording", "replaymod", "files"]
uses = ["session", "files"]
