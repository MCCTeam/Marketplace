schema-version = 2
kind = "compiled"
target = "any"
framework = "net10.0"
dmcbk = ">=0.1.0-preview.8 <0.2.0"
umpk = ">=0.9.0-beta.7 <0.10.0"
needs = ["commands"]
# See /man writing-plugins for what each manifest field means.
id = "anti-afk"
version = "2.0.3"
entry = "DMCBK.OfficialPlugins.AntiAFK.dll"
api-version = "1.0"
# Disabled by default: the anti-idle action sends "/ping" every 60s, and vanilla has no such command,
# so a default install answered every join with "Unknown or incomplete command". Point Command in
# settings.toml at something the server has, then set this to true.

man = ["anti-afk"]

[meta]
description = "Does something small at intervals so the server does not count you as idle and disconnect you."
tags = ["idle", "movement", "chat"]
uses = ["chat", "movement", "terrain"]
